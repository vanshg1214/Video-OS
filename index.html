<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Video Experience</title>
    <meta name="description" content="An immersive full-screen video experience.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="video-container" id="videoContainer">
        <!-- Replace the src with your actual video when you have it -->
        <video 
            id="mainVideo" 
            src="Charolette_2 (1) (1).mp4" 
            autoplay 
            muted 
            loop 
            playsinline>
        </video>

        <!-- Tap to unmute overlay -->
        <div class="unmute-overlay" id="unmuteOverlay">
            <button class="unmute-button" id="unmuteBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-muted">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"></path>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                <span>Tap to Unmute</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
